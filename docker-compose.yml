version: '3.9'

services:
  backend:
    build:
      context: ./rag-backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - ./rag-backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./rag-app
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./rag-app/.env.local
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
